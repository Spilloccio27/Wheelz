# Configurazione per pubblicare SOLO il sito vetrina.
#
# Su Netlify: base directory = "sito-vetrina". Non c'è niente da compilare —
# sono otto pagine HTML, un foglio di stile, due file JavaScript e le
# schermate in WebP — quindi non c'è build command. La `netlify.toml` alla
# radice del repository resta quella dell'applicazione.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Il sito non chiama nessuno: nessun CDN, nessun font remoto, nessun
    # tracciamento. `data:` serve solo alla grana del fondo, che è un SVG
    # in linea nel foglio di stile.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Le schermate cambiano solo quando cambia l'applicazione.
[[headers]]
  for = "/immagini/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
